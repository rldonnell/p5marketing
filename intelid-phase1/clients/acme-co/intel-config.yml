# IntelID — Client configuration
#
# Copy this file to clients/<slug>/intel-config.yml and fill in from the
# Google Form response. Anything below marked "REQUIRED" must be set.
# Anything else is optional (leave blank or remove the line).
#
# This file is the single source of truth for the weekly brief — the script
# reads it, pulls signals based on it, prompts Claude with it, and renders the
# brief using values from it. Treat it like production config.

client:
  slug: acme-co                         # REQUIRED. Folder name. Lowercase, hyphens.
  name: "Acme Co"                       # REQUIRED. Internal name (could differ from brand_name).
  brand_name: "Acme Co"                 # REQUIRED. As it appears in the brief.
  primary_domain: acme.com              # REQUIRED. No protocol.
  industry: "Plastic surgery — Scottsdale, AZ"   # REQUIRED. Free text for AI context.
  timezone: America/Phoenix             # REQUIRED. IANA timezone for the recipient.

# ─── Who receives the brief ────────────────────────────────────────────────
recipients:
  - name: "Jane Smith"
    email: jane@acme.com
    role: "Founder / CEO"
  # Add up to two more
  # - name: "Mark Lee"
  #   email: mark@acme.com
  #   role: "Marketing Director"

# ─── Sender / white-label ──────────────────────────────────────────────────
sender:
  from_name: "Acme Co Intelligence"     # REQUIRED. Appears as the From-name in inbox.
  from_email: "intel@acme-co.p5intel.com"   # REQUIRED. Use {slug}.p5intel.com until Phase 3 white-label.
  reply_to: "rdonnell@p5marketing.com"  # REQUIRED. Where replies go.
  logo_url: ""                          # Optional. URL to client logo. Leave blank for P5 fallback.
  brand_color: "#00e5c7"                # Optional. Hex color for headings. Default P5 teal.
  footer_html: |                        # Optional. Replaces the default footer.
    Prepared by P5 Marketing for Acme Co.
    Reply to opt out, change scope, or escalate something time-sensitive.

# ─── Competitors (3–5) ─────────────────────────────────────────────────────
# At least 3 required for a credible brief.
competitors:
  - name: "BetterAcme"
    domain: betteracme.com
    linkedin: betteracme                # Slug from linkedin.com/company/<slug>
    x: betteracme                       # Without the @
    notes: "Most aggressive on paid"
  - name: "AcmeAlt"
    domain: acmealt.com
    linkedin: acmealt
  - name: "ThirdCompetitor"
    domain: thirdcompetitor.com
  # - name: "FourthOptional"
  #   domain: ...
  # - name: "FifthOptional"
  #   domain: ...

# ─── Social channels to follow (up to 5) ───────────────────────────────────
# Each channel: platform + client's own handle + competitor handles (optional).
social_channels:
  - platform: linkedin
    own_handle: acme-co
    competitor_handles: [betteracme, acmealt]
  - platform: x
    own_handle: acmeco
    competitor_handles: [betteracme]
  - platform: youtube
    own_channel_id: ""                  # UC... — leave blank to skip
    competitor_channel_ids: []
  - platform: reddit
    subreddits: [plasticsurgery, askdocs]
  - platform: instagram
    own_handle: acmeco
    competitor_handles: [betteracme]

# ─── Category keywords (5–10) ──────────────────────────────────────────────
# What the client's prospects are actually searching. Used for DataForSEO
# SERP queries and category-conversation analysis.
category_keywords:
  - "rhinoplasty scottsdale"
  - "plastic surgeon near me"
  - "best mommy makeover"
  - "deep plane facelift recovery"
  - "non-surgical facelift"

# ─── Watchpoints — things to always flag ───────────────────────────────────
# Fed directly into the AI prompt. One per line.
watchpoints:
  - "Any mention of competitor BetterAcme by name in press"
  - "Sentiment shift around Dr. Smith personally"
  - "New entrants opening in Scottsdale, AZ"
  - "Regulatory: BBL safety news"

# ─── Brief settings ────────────────────────────────────────────────────────
brief_settings:
  tone: standard                        # terse | standard | detailed
  sections:                             # Set any to false to skip
    competitor_moves: true
    social_activity: true
    public_reputation: true
    category_conversation: true
    strategic_recommendations: true
  send_day: monday                      # Day of week to send
  send_time_local: "09:00"              # 24h, recipient timezone

# ─── Trial / billing state ─────────────────────────────────────────────────
trial:
  status: active                        # active | converted | paused | cancelled
  started: 2026-05-14
  briefs_remaining: 4
  convert_after_brief: 3                # Brief # where "want to keep going?" CTA appears
  card_on_file: false

billing:
  plan: standard                        # $300/mo
  stripe_customer_id: null              # Set after card added
  next_invoice_date: null

# ─── Internal — for P5 use only ────────────────────────────────────────────
internal:
  p5_owner: "Robert Donnell"
  lead_source: "Inbound (contact form)"
  signed_up_at: 2026-05-14
  notes: |
    Spoke with Jane on a discovery call 5/12. She runs marketing herself.
    Pain: Wednesday-morning competitor-news surprises from sales reps.
    Wants to see deep-plane facelift category data specifically.
